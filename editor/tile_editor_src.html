<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویرایشگر تایل‌های سیاه‌چال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTFACE__*/
/* Layout: a drafting desk. The tile sits as a print sheet; tools and checks run in a side column. Settings and print open as overlays. */
:root{
  --bg:#e9e7e2; --panel:#f6f5f2; --ink:#1d1c1a; --muted:#6b675f; --line:#cfcbc2;
  --accent:#7a3b1e; --accent-soft:#ead9cd; --bad:#b3261e; --bad-soft:#f6dcda; --ok:#2f6b3a; --ok-soft:#dbeadc; --warn:#9a6a00; --warn-soft:#f5e9c8;
  --paper:#ffffff;
  --f-body:"V","Vazirmatn",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1b19; --panel:#262522; --ink:#ecebe7; --muted:#a19d94; --line:#3d3b37;
  --accent:#e0a37f; --accent-soft:#4a3326; --bad:#ff8a80; --bad-soft:#4a2421; --ok:#8fd19a; --ok-soft:#24382a; --warn:#e6c26a; --warn-soft:#3d331a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1b19; --panel:#262522; --ink:#ecebe7; --muted:#a19d94; --line:#3d3b37;
  --accent:#e0a37f; --accent-soft:#4a3326; --bad:#ff8a80; --bad-soft:#4a2421; --ok:#8fd19a; --ok-soft:#24382a; --warn:#e6c26a; --warn-soft:#3d331a; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:800;margin:0;flex:1;min-width:12em}
.save{font-size:12px;color:var(--muted)}
.save.err{color:var(--bad)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.thumb:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.tilebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tilebar .num{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tilebar input,.tilebar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
.tilebar input{width:12em;max-width:100%}
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.12);padding:10px;max-width:640px;width:100%}
.sheet svg{display:block;width:100%;height:auto;direction:ltr}
svg text{font-family:var(--f-body)}
.modes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--accent);color:var(--panel)}
.hint{font-size:12px;color:var(--muted)}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:13px;font-weight:800;margin:0}
.card h3{font-size:12.5px;font-weight:800;margin:6px 0 0}
.grid-items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.item svg,.item img{width:26px;height:26px;object-fit:contain}
.item svg *{fill:var(--ink)}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);cursor:pointer;font-size:12.5px;color:var(--ink)}
.checks label.on{border-color:var(--accent);background:var(--accent-soft)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{background:var(--bad-soft);color:var(--ink);border-inline-start:3px solid var(--bad);padding:6px 8px;border-radius:4px;font-size:12.5px;cursor:pointer}
.issues li.warn{background:var(--warn-soft);border-inline-start-color:var(--warn)}
.okbox{background:var(--ok-soft);border-inline-start:3px solid var(--ok);padding:6px 8px;border-radius:4px;font-size:12.5px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;resize:vertical}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11px;position:relative}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb svg{width:100%;height:auto;background:#fff;border-radius:2px;direction:ltr}
.thumb .flag{position:absolute;top:2px;left:2px;background:var(--bad);color:var(--panel);border-radius:9px;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.thumb .ed{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* stats grid */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.tot{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tot td,table.tot th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center}
table.tot thead th{position:sticky;top:0;background:var(--panel);font-weight:700;color:var(--muted);cursor:pointer;user-select:none;vertical-align:bottom}
table.tot thead th.grp{cursor:default;color:var(--ink);border-bottom:1px solid var(--line)}
table.tot thead th[aria-sort]::after{content:" ▾";color:var(--accent)}
table.tot thead th[aria-sort="ascending"]::after{content:" ▴"}
table.tot td:first-child,table.tot th:first-child{text-align:right}
table.tot tbody tr{cursor:pointer}
table.tot tbody tr:hover{background:var(--accent-soft)}
table.tot tbody tr.cur{outline:2px solid var(--accent);outline-offset:-2px}
table.tot tfoot td{font-weight:800;background:var(--bg)}
table.tot tfoot tr.avg td{font-weight:500;color:var(--muted)}
table.tot td.z{color:var(--line)}
table.tot .sep{border-inline-start:2px solid var(--line)}
.lv1{color:#9a6a00} .lv2{color:#7a3b1e}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,18,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:880px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg>.hd h2{margin:0;font-size:16px;flex:1}
.dlg>.bd{padding:14px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 14px}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:700}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 18px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12px;color:var(--muted)}
.fld .in{display:flex;gap:8px;align-items:center}
.fld input[type=number],.fld input[type=text],.fld select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;width:100%}
.fld input[type=number]{width:6em}
.fld input[type=color]{width:42px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pi{width:96px;display:flex;flex-direction:column;gap:3px;font-size:11px}
.pi .im{width:96px;height:96px;border:1px solid var(--line);border-radius:6px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pi .im img{width:100%;height:100%;object-fit:cover}
.pi.round .im{border-radius:50%}
.pi .x{position:absolute;top:3px;left:3px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:20px;padding:0;font-size:12px}
.pi select{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:11px;padding:2px}
.upl{width:96px;height:96px;border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;color:var(--muted);cursor:pointer;padding:6px}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.cat{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.cat .ch{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.cat .ch .n{font-weight:500;color:var(--muted);font-size:12px}
.icrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.icrow .pv{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center}
.icrow .pv svg,.icrow .pv img{width:30px;height:30px;object-fit:contain}
.icrow .pv svg *{fill:#000}
.note{font-size:12px;color:var(--muted);line-height:1.8}
.prog{font-size:13px;color:var(--accent);font-weight:700}
.tsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tsel label{display:flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ویرایشگر تایل‌های سیاه‌چال</h1>
    <span class="save" id="save">در حال آماده شدن…</span>
    <div class="nav">
      <button class="btn" id="b-settings" type="button">تنظیمات و گرافیک</button>
      <button class="btn primary" id="b-print" type="button">PDF چاپی A4</button>
      <button class="btn" id="b-export" type="button">ذخیرهٔ فایل پروژه</button>
      <button class="btn" id="b-import" type="button">باز کردن فایل پروژه</button>
      <input type="file" id="f-import" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <div class="tilebar">
        <span class="num" id="num">۰</span>
        <input id="tname" aria-label="نام تایل">
        <select id="tlevel" aria-label="سطح تایل">
          <option value="0">تایل آغاز</option><option value="1">سطح ۱</option><option value="2">سطح ۲</option>
        </select>
        <button class="btn" id="prev" type="button">قبلی</button>
        <button class="btn" id="next" type="button">بعدی</button>
        <button class="btn" id="undo" type="button">برگرداندن</button>
        <button class="btn danger" id="reset" type="button">بازگشت به نسخهٔ اصلی</button>
      </div>
      <div class="modes">
        <div class="seg" role="group" aria-label="حالت">
          <button type="button" id="m-select" class="on">انتخاب و ویرایش</button>
          <button type="button" id="m-add">کشیدن راهروی تازه</button>
        </div>
        <span class="hint" id="hint"></span>
      </div>
      <div class="sheet"><div id="svgbox"></div></div>
      <div id="confirm" class="card" hidden>
        <span id="confirm-text"></span>
        <div class="row"><button class="btn danger" id="confirm-yes" type="button">بله</button><button class="btn" id="confirm-no" type="button">نه</button></div>
      </div>
    </div>

    <aside>
      <div class="card" id="editor"></div>
      <div class="card">
        <h2>بررسی قانون‌ها</h2>
        <div id="issues"></div>
      </div>
      <div class="card">
        <h2>یادداشت برای Claude</h2>
        <textarea id="notes" placeholder="هر توضیحی دربارهٔ این تایل که می‌خواهی Claude بداند"></textarea>
      </div>
    </aside>
  </div>

  <div class="card">
    <h2>همهٔ تایل‌ها</h2>
    <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="card">
    <div class="row"><h2 style="flex:1">اطلاعات آماری</h2><span class="hint">روی سرستون بزن تا مرتب شود؛ روی هر ردیف بزن تا آن تایل باز شود.</span></div>
    <div class="tablewrap" id="totals"></div>
  </div>
</div>

<!-- settings overlay -->
<div class="ov" id="ov-set" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="hd"><h2 id="set-title">تنظیمات و گرافیک (روی همهٔ تایل‌ها اعمال می‌شود)</h2><button class="btn" id="set-close" type="button">بستن</button></div>
    <div class="tabs" id="set-tabs">
      <button type="button" data-tab="dim" class="on">ابعاد و دایره‌ها</button>
      <button type="button" data-tab="cor">راهروها</button>
      <button type="button" data-tab="ico">آیکون‌ها</button>
      <button type="button" data-tab="bg">پس‌زمینه و قاب</button>
      <button type="button" data-tab="cell">گرافیک دایره‌ها</button>
      <button type="button" data-tab="info">اطلاعات روی تایل</button>
    </div>
    <div class="bd" id="set-body"></div>
  </div>
</div>

<!-- print overlay -->
<div class="ov" id="ov-print" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pr-title">
    <div class="hd"><h2 id="pr-title">PDF چاپی روی A4 با ۳۰۰ dpi</h2><button class="btn" id="pr-close" type="button">بستن</button></div>
    <div class="bd" id="pr-body"></div>
  </div>
</div>

<script>
const BASE=__TILES__;
const BASE_NOTES=__NOTES__;
const ICON=__ICONS__;
const FONTCSS=__FONTCSS__;
const FA='۰۱۲۳۴۵۶۷۸۹'; const fa=n=>String(n).replace(/\d/g,d=>FA[d]);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CELL={'':['','خالی'],Y:['daemon-skull','اهریمن زرد'],O:['daemon-skull','اهریمن نارنجی'],R:['daemon-skull','اهریمن قرمز'],
  Q:['daemon-skull','اهریمن نامعلوم'],T:['locked-chest','صندوقچه'],C:['two-coins','۲ سکه'],S:['scroll-unfurled','۲ طومار'],
  E:['death-skull','جوهرهٔ تاریک'],P:['magic-portal','پورتال'],F:['water-fountain','چشمهٔ پالایش'],K:['cursed-star','نفرین‌شده'],A:['castle','دروازهٔ شهر']};
const SHORT={'':'خالی',Y:'زرد',O:'نارنجی',R:'قرمز',Q:'نامعلوم',T:'صندوقچه',C:'سکه',S:'طومار',E:'جوهره',P:'پورتال',F:'چشمه',K:'نفرین',A:'آغاز'};
const LVL={Y:'۱',O:'۲',R:'۳',Q:'؟'};
const ITEMS=['','Y','O','R','Q','T','C','S','E','P','F','K','A'];

/* ---------- settings ---------- */
const DEF={tileMM:112,marginMM:5,cellD:25,cellStroke:0.9,cellStrokeCol:'#000000',cellFill:'#ffffff',rings:true,
  corW:6.6,corBorder:0.8,corStyle:'filled',corFillCol:'#ffffff',corBorderCol:'#000000',markCol:'#000000',corTex:true,
  badgeScale:1,badgeFill:'#ffffff',badgeStroke:'#000000',iconCol:'#000000',iconOverArt:true,labels:true,labelCol:'#000000',lvlBadge:true,
  tileBg:'#ffffff',edge:true,edgeCol:'#000000',edge2:true,
  text:'',textPos:'bottom',textSize:3,textCol:'#000000',tileNo:false,
  seed:1};
const PDEF={margin:10,gap:4,bleed:0,cut:true,start:true,fmt:'jpeg',sel:null};
let SET=Object.assign({},DEF), PSET=Object.assign({},PDEF);
let S,M,P,RC,R,CW,CI,F,BF,BS;
function geo(){S=+SET.tileMM;M=+SET.marginMM;P=(S-2*M)/3;RC=SET.cellD/2;R=RC-1;CW=+SET.corW;CI=Math.max(0,CW-2*SET.corBorder);F=RC/16;BF=P/((140-6)/3);BS=(RC/12.5)*SET.badgeScale}
geo();

/* ---------- images (backgrounds, frames, cell art, custom icons, corridor texture) ---------- */
// each: {id, kind:'bg'|'frame'|'cell'|'icon'|'tex', cat, level:'1'|'2'|'b', name, data(dataURL), url(object URL for screen)}
let IMGS=[];
const CELLCATS=[['*','همهٔ خانه‌ها (وقتی دستهٔ خودش گرافیک ندارد)'],['','خانهٔ معمولی (خالی)'],['Y','اهریمن زرد'],['O','اهریمن نارنجی'],['R','اهریمن قرمز'],['Q','اهریمن نامعلوم'],
  ['T','صندوقچه'],['C','سکه'],['S','طومار'],['E','جوهرهٔ تاریک'],['P','پورتال'],['F','چشمه'],['K','نفرین‌شده'],['A','دروازهٔ شهر']];
const CORICONS=[['torch','مشعل (راهروی تاریک)'],['war-pick','کلنگ (راهروی ریزش‌کرده)'],['footprint','پا (راهروی طولانی، ۲ بار)'],['arrow','پیکان (راهروی یک‌طرفه)']];
function dataToBlobUrl(d){try{const [h,b]=d.split(',');const mime=h.match(/data:([^;]+)/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}))}catch(e){return d}}
const imgOf=(kind,cat)=>IMGS.filter(x=>x.kind===kind&&(cat===undefined||x.cat===cat));
const customIcon=name=>IMGS.find(x=>x.kind==='icon'&&x.cat===name);
let PRINT=false; // true while building print SVGs: use data URLs (object URLs do not load inside an SVG drawn to a canvas)
const href=im=>PRINT?im.data:im.url;

// deterministic random assignment, spread so the same picture repeats as little as possible
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function perm(n,seed){const a=[...Array(n).keys()];let h=seed;for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;h=(h+0x9e3779b9)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let ASSIGN={bg:{},frame:{},cell:{}};
function assign(){ASSIGN={bg:{},frame:{},cell:{}};

    hr.forEach(i=>out.push(`<path d="${ds[i]}" stroke="#b3261e" stroke-opacity=".55" stroke-width="9" fill="none" pointer-events="none"/>`));
    sr.forEach(i=>out.push(`<path d="${ds[i]}" stroke="#7a3b1e" stroke-opacity=".5" stroke-width="10" fill="none" pointer-events="none"/>`));
    hc.forEach(k=>{const [x,y]=ctr(unkey(k));out.push(`<circle cx="${x}" cy="${y}" r="${RC+1.6}" fill="none" stroke="#b3261e" stroke-width="1.6" pointer-events="none"/>`)});
    sc.forEach(k=>{const [x,y]=ctr(unkey(k));out.push(`<circle cx="${x}" cy="${y}" r="${RC+1.8}" fill="none" stroke="#7a3b1e" stroke-width="1.8" pointer-events="none"/>`)});

  }
  out.push('</svg>');return out.join('');
}

/* ---------- stats: one row per tile, totals per level ---------- */
const STATCOLS=[
  ['cells','خانه','g1'],['Y','زرد','g1'],['O','نارنجی','g1'],['R','قرمز','g1'],['Q','نامعلوم','g1'],['dem','کل اهریمن','g1'],
  ['T','صندوقچه','g2'],['C','سکه','g2'],['S','طومار','g2'],['E','جوهره','g2'],['P','پورتال','g2'],['F','چشمه','g2'],['K','نفرین','g2'],['emp','خالی','g2'],
  ['cor','کل راهرو','g3'],['simple','ساده','g3'],['long','طولانی','g3'],['dark','تاریک (مشعل)','g3'],['coll','ریزش‌کرده (کلنگ)','g3'],['both','تاریک و ریزشی','g3'],['ow','یک‌طرفه','g3'],
  ['exits','خروجی','g4'],['exIn','خروجی ورودی','g4'],['exOut','فقط خروج','g4'],['exx','خروجی به خروجی','g4'],['exDark','خروجی با مشعل','g4'],['exColl','خروجی با کلنگ','g4'],['exLong','خروجی طولانی','g4']];

function tileStats(t){const o={};STATCOLS.forEach(([k])=>o[k]=0);
  Object.values(t.cells).forEach(v=>{o.cells++;if(v in o)o[v]++;if(v==='')o.emp++;if(v in LVL)o.dem++});
  t.cors.forEach(c=>{const k=c[2],a=isExit(c[0]),b=isExit(c[1]);o.cor++;
    if(!kD(k)&&!kX(k)&&!kL(k)&&!ow1(k))o.simple++;if(kL(k))o.long++;if(kD(k))o.dark++;if(kX(k))o.coll++;if(kD(k)&&kX(k))o.both++;if(ow1(k))o.ow++;
    [[a,0],[b,1]].forEach(([isE,j])=>{if(!isE)return;o.exits++;const enter=j===1?bwd(k):fwd(k);if(enter)o.exIn++;else o.exOut++;
      if(kD(k))o.exDark++;if(kX(k))o.exColl++;if(kL(k))o.exLong++});
    if(a&&b)o.exx++});
  return o}
let SORT=null;
function renderTotals(){
  const rows=tiles.map((t,i)=>({i,t,s:tileStats(t)}));
  let list=[...rows];if(SORT){const [c,dir]=SORT;list.sort((a,b)=>{const va=c==='name'?a.t.name:c==='lvl'?a.t.level:a.s[c],vb=c==='name'?b.t.name:c==='lvl'?b.t.level:b.s[c];return (va>vb?1:va<vb?-1:a.i-b.i)*dir})}
  const sum=l=>{const o={};STATCOLS.forEach(([k])=>o[k]=0);const rs=rows.filter(r=>r.t.level===l);rs.forEach(r=>STATCOLS.forEach(([k])=>o[k]+=r.s[k]));return [o,rs.length]};
  const td=(v,cls='')=>`<td class="${v===0?'z ':''}${cls}">${typeof v==='number'?fa(Math.round(v*10)/10):v}</td>`;
  const sepAt=new Set();let last='';STATCOLS.forEach(([k,,g])=>{if(g!==last){sepAt.add(k);last=g}});
  const cells=s=>STATCOLS.map(([k])=>td(s[k],sepAt.has(k)?'sep':'')).join('');
  let grpRow='<tr><th class="grp" colspan="3"></th>';last='';let span=0;const gs=[];STATCOLS.forEach(([,,g])=>{if(g!==last){if(last)gs.push([last,span]);last=g;span=0}span++});gs.push([last,span]);
  grpRow+=gs.map(([g,n])=>`<th class="grp sep" colspan="${n}">${GRPS[g]}</th>`).join('')+'</tr>';
  const sa=c=>SORT&&SORT[0]===c?` aria-sort="${SORT[1]>0?'ascending':'descending'}"`:'';
  const head=`<tr><th data-s="i"${sa('i')}>#</th><th data-s="name"${sa('name')}>نام</th><th data-s="lvl"${sa('lvl')}>سطح</th>${STATCOLS.map(([k,l])=>`<th data-s="${k}"${sa(k)} class="${sepAt.has(k)?'sep':''}">${l}</th>`).join('')}</tr>`;
  const body=list.map(r=>`<tr data-t="${r.i}" class="${r.i===cur?'cur':''}"><td>${fa(r.i)}</td><td>${esc(r.t.name)}</td><td class="lv${r.t.level}">${r.t.level?fa(r.t.level):'آغاز'}</td>${cells(r.s)}</tr>`).join('');
  let foot='';[1,2].forEach(l=>{const [o,n]=sum(l);if(!n)return;const avg={};STATCOLS.forEach(([k])=>avg[k]=o[k]/n);
    foot+=`<tr><td colspan="3">جمع سطح ${fa(l)} (${fa(n)} تایل)</td>${cells(o)}</tr><tr class="avg"><td colspan="3">میانگین هر تایل سطح ${fa(l)}</td>${cells(avg)}</tr>`});
  const [a1]=sum(1),[a2]=sum(2),all={};STATCOLS.forEach(([k])=>all[k]=a1[k]+a2[k]);
  foot+=`<tr><td colspan="3">جمع سطح ۱ و ۲</td>${cells(all)}</tr>`;
  $('totals').innerHTML=`<table class="tot"><thead>${grpRow}${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
  $('totals').querySelectorAll('thead th[data-s]').forEach(th=>th.onclick=()=>{const c=th.dataset.s;SORT=c==='i'&&SORT&&SORT[0]==='i'&&SORT[1]<0?null:[c,SORT&&SORT[0]===c?-SORT[1]:(c==='name'||c==='i'||c==='lvl'?1:-1)];renderTotals()});
  $('totals').querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>go(+tr.dataset.t));
}

    <div class="checks">${box('c-d',d,'تاریک (مشعل)')}${box('c-x',x,'ریزش‌کرده (کلنگ)')}${box('c-l',l,'طولانی (۲ گام)')}${box('c-ow',ow,'یک‌طرفه')}</div>

    const bd=$('bend');let pushed=false;

  ed.innerHTML=`<h2>راهنما</h2><span class="hint">روی یک خانه بزن تا محتوایش را عوض کنی. روی نشان یا خط یک راهرو بزن تا تاریک، ریزش‌کرده، طولانی یا یک‌طرفه بودنش (هر ترکیبی) یا خمیدگی‌اش را عوض کنی. مستطیل‌های کوچک لبه جای خروجی‌اند: روی جای خالی بزن تا به نزدیک‌ترین خانهٔ همان ردیف یا ستون وصل شود، یا با «کشیدن راهروی تازه» اول هر خانه‌ای را بزن و بعد جای خروجی را. دایرهٔ نقطه‌چین یعنی جای خالی؛ بزن تا خانه اضافه شود. ظاهر، ابعاد و گرافیک‌ها در «تنظیمات و گرافیک» است. هر تغییری خودکار ذخیره می‌شود.</span>`;
}

    change(t=>t.cors.push([ac,e2,'s1',0]));pendingA=null;sel={type:'cor',i:tiles[cur].cors.length-1};setMode('select');return}

  if(g.dataset.cell)sel={type:'cell',k:g.dataset.cell};else sel={type:'cor',i:+g.dataset.cor};

/* ---------- image handling ---------- */
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
// keep enough pixels for 300 dpi at the largest size the picture can be printed, no more
function maxPx(kind){const dpi=300/25.4;if(kind==='cell')return Math.ceil(45*dpi);if(kind==='icon')return 600;if(kind==='tex')return 800;return Math.ceil((200+10)*dpi)}
async function prepImage(f,kind){const d=await readFile(f);if(f.type==='image/svg+xml')return d;
  const im=await loadImg(d);const mx=maxPx(kind);let w=im.naturalWidth,h=im.naturalHeight;if(Math.max(w,h)<=mx&&f.size<2.5e6)return d;
  const s=Math.min(1,mx/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
  const alpha=f.type==='image/png'||f.type==='image/webp'||f.type==='image/gif';return cv.toDataURL(alpha?'image/png':'image/jpeg',.93)}
async function addImages(files,kind,cat){setSave('در حال افزودن '+fa(files.length)+' تصویر…');
  for(const f of files){try{const data=await prepImage(f,kind);
    if(kind==='icon'||kind==='tex'){for(const old of IMGS.filter(x=>x.kind===kind&&(kind==='tex'||x.cat===cat)))await delImage(old.id,true)}
    const im={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),kind,cat:cat||'',level:'b',name:f.name,data};im.url=dataToBlobUrl(data);IMGS.push(im);await putImage(im)}
    catch(e){setSave('تصویر «'+f.name+'» خوانده نشد',true)}}
  setSave(idbOk?'تصویرها ذخیره شد':'تصویرها اضافه شد، ولی این مرورگر اجازهٔ نگه‌داشتن‌شان را نمی‌دهد؛ فایل پروژه را ذخیره کن',!idbOk)}
async function delImage(id,quiet){const i=IMGS.findIndex(x=>x.id===id);if(i<0)return;try{URL.revokeObjectURL(IMGS[i].url)}catch(e){}IMGS.splice(i,1);await idbDel(id)}

/* ---------- storage: tiles in the shared db (claude.ai) or this browser; settings and images always in this browser ---------- */
let idb=null,idbOk=false;
function idbOpen(){return new Promise(ok=>{try{const r=indexedDB.open('dungeon-tile-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('img',{keyPath:'id'});r.onsuccess=()=>{idb=r.result;idbOk=true;ok()};r.onerror=()=>ok()}catch(e){ok()}})}
function idbAll(){return new Promise(ok=>{if(!idb)return ok([]);try{const q=idb.transaction('img').objectStore('img').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])}catch(e){ok([])}})}
function putImage(im){return new Promise(ok=>{if(!idb)return ok();try{const {url,...rec}=im;const tx=idb.transaction('img','readwrite');tx.objectStore('img').put(rec);tx.oncomplete=ok;tx.onerror=()=>{idbOk=false;ok()}}catch(e){idbOk=false;ok()}})}
function idbDel(id){return new Promise(ok=>{if(!idb)return ok();try{const tx=idb.transaction('img','readwrite');tx.objectStore('img').delete(id);tx.oncomplete=ok;tx.onerror=ok}catch(e){ok()}})}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

function setSave(m,err){const s=$('save');s.textContent=m;s.classList.toggle('err',!!err)}
const timers={};const writing={};const dirty={};
function scheduleSave(i){if(HOST){HOST.changed(tiles,notes);setSave('در ویرایشگر بازی ثبت شد');return}dirty[i]=(dirty[i]||0)+1;saveLocalTiles();
  if(!db){dirty[i]=0;setSave('در همین مرورگر ذخیره شد');return}
  setSave('در حال ذخیره…');clearTimeout(timers[i]);timers[i]=setTimeout(()=>save(i),700)}
async function save(i){if(writing[i]){clearTimeout(timers[i]);timers[i]=setTimeout(()=>save(i),400);return}writing[i]=true;const mark=dirty[i];
  try{if(!edited[i]&&JSON.stringify(tiles[i])===JSON.stringify(BASE[i])&&!notes[i])await db.doc('tiles/t'+String(i).padStart(2,'0')).delete();
    else await db.doc('tiles/t'+String(i).padStart(2,'0')).set({index:i,tile:tiles[i],notes:notes[i],updatedAt:new Date().toISOString()});
    if(dirty[i]===mark)dirty[i]=0;setSave(dirty[i]?'در حال ذخیره…':'ذخیره شد')}
  catch(e){setSave(e&&e.code==='invalid_argument'?'اجازهٔ ذخیره نداری':'ذخیره نشد؛ دوباره تغییر بده تا دوباره تلاش شود',true)}
  finally{writing[i]=false}}

async function download(name,blob){let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){dl=null}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ---------- print: A4 at 300 dpi ---------- */
const A4=[210,297];
function layout(n){const cell=S+2*PSET.bleed,g=+PSET.gap,m=+PSET.margin;
  const fit=(W,H)=>{const c=Math.max(0,Math.floor((W-2*m+g)/(cell+g))),r=Math.max(0,Math.floor((H-2*m+g)/(cell+g)));return {c,r,per:c*r,W,H}};
  const a=fit(A4[0],A4[1]),b=fit(A4[1],A4[0]);const L=b.per>a.per?Object.assign(b,{orient:'l'}):Object.assign(a,{orient:'p'});
  L.pages=L.per?Math.ceil(n/L.per):0;L.cell=cell;return L}
function printList(){const s=PSET.sel;return tiles.map((t,i)=>i).filter(i=>s&&s.length===tiles.length?s[i]:(tiles[i].level>0||PSET.start))}

  <label class="fld"><span>فرمت تصویر داخل PDF</span><select data-p="fmt"><option value="jpeg" ${PSET.fmt==='jpeg'?'selected':''}>JPEG باکیفیت (فایل سبک‌تر)</option><option value="png" ${PSET.fmt==='png'?'selected':''}>PNG بدون افت (فایل سنگین‌تر)</option></select></label></div>

  <div class="row"><button class="btn primary" type="button" id="pr-go" ${L.per&&list.length?'':'disabled'}>ساختن و دانلود PDF</button><span class="prog" id="pr-prog"></span></div>`;

async function tileCanvas(i,px){PRINT=true;let svg;try{svg=tileSvg(i,{bleed:+PSET.bleed,px,font:true})}finally{PRINT=false}
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  try{const im=await loadImg(url);await new Promise(r=>setTimeout(r,30));const cv=document.createElement('canvas');cv.width=px;cv.height=px;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,px,px);g.drawImage(im,0,0,px,px);return cv}
  finally{URL.revokeObjectURL(url)}}

function addScript(src){return new Promise(ok=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ok;document.head.appendChild(s)})}

  btn.disabled=true;assign();
  try{const list=printList(),L=layout(list.length),cell=L.cell,bl=+PSET.bleed,g=+PSET.gap;
    const px=Math.round(cell/25.4*300);
    const doc=new window.jspdf.jsPDF({orientation:L.orient==='l'?'landscape':'portrait',unit:'mm',format:'a4',compress:true});
    const gw=L.c*cell+(L.c-1)*g,gh=L.r*cell+(L.r-1)*g,ox=(L.W-gw)/2,oy=(L.H-gh)/2;
    for(let n=0;n<list.length;n++){const p=Math.floor(n/L.per),j=n%L.per;if(n&&j===0)doc.addPage('a4',L.orient==='l'?'landscape':'portrait');
      prog.textContent=`تایل ${fa(n+1)} از ${fa(list.length)}…`;await new Promise(r=>setTimeout(r,0));
      const cv=await tileCanvas(list[n],px);const x=ox+(j%L.c)*(cell+g),y=oy+Math.floor(j/L.c)*(cell+g);
      const fmt=PSET.fmt==='png'?'PNG':'JPEG';doc.addImage(cv.toDataURL(fmt==='PNG'?'image/png':'image/jpeg',.95),fmt,x,y,cell,cell,undefined,'FAST');
      if(PSET.cut){const tx=x+bl,ty=y+bl,len=Math.max(1.5,Math.min(4,g/2+bl,PSET.margin)),o=bl+.6;doc.setLineWidth(.15);doc.setDrawColor(0);
        [[tx,ty],[tx+S,ty],[tx,ty+S],[tx+S,ty+S]].forEach(([cx,cy],q)=>{const sx=q%2?1:-1,sy=q<2?-1:1;
          doc.line(cx+sx*o,cy,cx+sx*(o+len),cy);doc.line(cx,cy+sy*o,cx,cy+sy*(o+len))})}}
    prog.textContent='در حال ساختن فایل…';await new Promise(r=>setTimeout(r,0));
    doc.setProperties({title:'Dungeon tiles '+today()});
    download('dungeon_tiles_A4_300dpi_'+today()+'.pdf',doc.output('blob'));prog.textContent=`PDF با ${fa(L.pages)} صفحه دانلود شد.`}
  catch(e){console.error(e);prog.textContent='ساختن PDF شکست خورد: '+(e&&e.message||e)}
  finally{btn.disabled=false}}

/* ---------- start ---------- */
(async()=>{
  const st=lsGet('dte-settings');if(st){SET=Object.assign({},DEF,st.SET||{});PSET=Object.assign({},PDEF,st.PSET||{});geo()}
  await idbOpen();(await idbAll()).forEach(r=>{const im=Object.assign({},r);im.url=dataToBlobUrl(im.data);IMGS.push(im)});
  try{db=!HOST&&window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){const v=HOST?null:lsGet('dte-tiles');if(v&&Array.isArray(v.tiles)){tiles=v.tiles;notes=v.notes||notes;edited=v.edited||tiles.map(()=>true);while(hist.length<tiles.length)hist.push([])}
    render();setSave(idbOk?'تغییرات در همین مرورگر ذخیره می‌شود. برای نسخهٔ پشتیبان «ذخیرهٔ فایل پروژه» را بزن.':'این مرورگر اجازهٔ ذخیره نمی‌دهد؛ قبل از بستن «ذخیرهٔ فایل پروژه» را بزن.',!idbOk);return}
  render();setSave('وصل شد');
  db.collection('tiles').onSnapshot(snap=>{let ch=false;snap.docs.forEach(d=>{const v=d.data();if(!v||typeof v.index!=='number')return;
      if(writing[v.index]||dirty[v.index]||d.metadata.hasPendingWrites)return;
      if(JSON.stringify(v.tile)!==JSON.stringify(tiles[v.index])||(v.notes||'')!==notes[v.index]){tiles[v.index]=clone(v.tile);notes[v.index]=v.notes||'';edited[v.index]=true;ch=true}});
    if(ch){if(sel&&sel.type==='cor'&&!tiles[cur].cors[sel.i])sel=null;render()}},
    e=>setSave('اتصال قطع شد؛ صفحه را دوباره باز کن',true));
})();
render();
</script>
