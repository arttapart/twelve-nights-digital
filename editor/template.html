<script>
'use strict';

const $ = id => document.getElementById(id);

/* ---------- storage (this browser): the working copy and the uploaded files ---------- */
let idb = null;
function idbOpen() { return new Promise(ok => { try { const r = indexedDB.open('twelve-nights-editor', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('art'); }; r.onsuccess = () => { idb = r.result; ok(); }; r.onerror = () => ok(); } catch (e) { ok(); } }); }

let W = clone(DEFAULT);          // the game data being edited (data/game.json)

let saveT = null;

async function saveNow() { const ok = await idbPut('kv', 'game', JSON.stringify(W)); status(ok ? 'در همین مرورگر ذخیره شد' : 'این مرورگر اجازهٔ ذخیره نمی‌دهد؛ از بخش «ساخت و انتشار» فایل zip بگیر', !ok); }
async function putFile(path, blob) { if (FILES[path]) URL.revokeObjectURL(FILES[path].url); FILES[path] = { blob, url: URL.createObjectURL(blob) }; await idbPut('art', path, blob); }

// art paths still referenced by the data
function artRefs() { const s = new Set(); (function walk(o) { if (!o) return; if (typeof o === 'string') { s.add(o); return; } if (typeof o === 'object') for (const k in o) if (k !== 'mode') walk(o[k]); })(W.art); return s; }

/* ---------- navigation ---------- */
const TABS = [
  ['g', 'داده‌های بازی'], ['cards', 'کارت‌های آکادمی'], ['wizards', 'جادوگران'], ['demons', 'کارت‌های اهریمن'], ['battlefield', 'اثرهای میدان نبرد'], ['items', 'وسایل و گنجینه‌ها'], ['challenges', 'توکن‌های چالش'], ['upgrades', 'ارتقاهای برد شخصی'], ['houses', 'خاندان‌ها'], ['rules', 'قانون‌ها و عددها'], ['tiles', 'تایل‌های سیاه‌چال'],
  ['g', 'ظاهر'], ['art', 'گرافیک'], ['texts', 'متن‌های برنامه'], ['colors', 'رنگ‌ها و ظاهر'],
  ['g', 'ساخت'], ['preview', 'پیش‌نمایش زنده'], ['build', 'ساخت و انتشار']];
let tab = 'cards';
try { tab = localStorage.getItem('tne-tab') || 'cards'; } catch (e) {}
function nav() { $('nav').innerHTML = TABS.map(([k, n]) => k === 'g' ? `<div class="grp">${n}</div>` : `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join(''); }
$('nav').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; go(b.dataset.t); };
function go(t) { if (tab === 'preview' && t !== 'preview') stopPreview(); tab = t; try { localStorage.setItem('tne-tab', t); } catch (e) {} nav(); show(); }
function show() { $('ver').textContent = 'نسخهٔ ' + fa(W.meta.version || ''); const m = $('main'); m.innerHTML = ''; (VIEWS[tab] || VIEWS.cards)(m); }
$('b-theme').onclick = () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); r.dataset.theme = cur === 'light' ? 'dark' : 'light'; try { localStorage.setItem('tne-theme', r.dataset.theme); } catch (e) {} };
try { const th = localStorage.getItem('tne-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

/* ---------- generic table ---------- */
// cols: [{k, l (label), h (hint), ty: text|num|sel|chk|area|code|color, opts:[[v,label]], w, get(row), set(row,v), ro}]
function table(host, o) {
  // o: {rows() -> array, cols, add() -> new row, key (unique field), onChange(), canAdd, canDel, note}
  let sortK = null, sortD = 1, filt = '';
  const sel = new Set();
  const wrap = document.createElement('div'); host.appendChild(wrap);
  function val(r, c) { return c.get ? c.get(r) : r[c.k]; }
  function draw() {
    const rows = o.rows();
    let idx = rows.map((r, i) => i);
    if (filt) idx = idx.filter(i => JSON.stringify(rows[i]).includes(filt));
    if (sortK) { const c = o.cols.find(x => x.k === sortK); idx.sort((a, b) => { const x = val(rows[a], c), y = val(rows[b], c); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'fa')) * sortD; }); }
    const dup = new Set(); if (o.key) { const seen = {}; rows.forEach((r, i) => { const k = r[o.key]; if (seen[k] != null || !k) { dup.add(i); dup.add(seen[k]); } seen[k] = i; }); }
    let h = `<div class="bar"><input type="search" placeholder="جستجو در جدول…" value="${esc(filt)}" data-f>`;
    if (o.canAdd !== false) h += `<button class="btn" data-add>+ ردیف تازه</button>`;
    if (o.canDel !== false) h += `<button class="btn g" data-dupl ${sel.size ? '' : 'disabled'}>کپی ردیف‌های تیک‌خورده</button><button class="btn r" data-del ${sel.size ? '' : 'disabled'}>حذف ردیف‌های تیک‌خورده (${fa(sel.size)})</button>`;
    h += `<span class="mut">${fa(idx.length)} ردیف</span>${o.note ? `<span class="mut">${o.note}</span>` : ''}</div>`;
    h += `<div class="tw"><table class="t"><thead><tr>${o.canDel !== false ? '<th>✓</th>' : ''}${o.cols.map(c => `<th data-s="${c.k}" style="${c.w ? 'min-width:' + c.w + 'px' : ''}">${c.l}${sortK === c.k ? (sortD > 0 ? ' ▲' : ' ▼') : ''}${c.h ? `<small>${c.h}</small>` : ''}</th>`).join('')}</tr></thead><tbody>`;
    for (const i of idx) {
      const r = rows[i];
      h += `<tr data-i="${i}" class="${sel.has(i) ? 'sel' : ''} ${dup.has(i) ? 'bad' : ''}">${o.canDel !== false ? `<td><input type="checkbox" data-sel ${sel.has(i) ? 'checked' : ''}></td>` : ''}`;
      for (const c of o.cols) {
        const v = val(r, c), ro = c.ro ? 'disabled' : '';
        let cell;
        if (c.ty === 'num') cell = `<input type="number" step="any" value="${v == null || v === '' ? '' : v}" data-c="${c.k}" ${ro}>`;
        else if (c.ty === 'chk') cell = `<input type="checkbox" ${v ? 'checked' : ''} data-c="${c.k}" ${ro}>`;
        else if (c.ty === 'sel') { const op = typeof c.opts === 'function' ? c.opts(r) : c.opts; cell = `<select data-c="${c.k}" ${ro}>${op.map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(v == null ? '' : v) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`; }
        else if (c.ty === 'area') cell = `<textarea data-c="${c.k}" ${ro}>${esc(v)}</textarea>`;
        else if (c.ty === 'color') cell = `<input type="color" value="${esc(v)}" data-c="${c.k}" ${ro}>`;
        else if (c.ty === 'html') cell = c.html(r);
        else cell = `<input value="${esc(v)}" data-c="${c.k}" ${ro}>`;
        h += `<td class="${c.ty === 'code' ? 'code' : ''}" style="${c.w ? 'min-width:' + c.w + 'px' : ''}">${cell}</td>`;
      }
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    wrap.innerHTML = h;
  }
  wrap.addEventListener('input', e => { if (e.target.dataset.f != null) { filt = e.target.value; const p = e.target.selectionStart; draw(); const n = wrap.querySelector('[data-f]'); n.focus(); n.setSelectionRange(p, p); } });
  wrap.addEventListener('change', e => {
    const t = e.target, tr = t.closest('tr'); if (!tr || tr.dataset.i == null) return;
    const i = +tr.dataset.i, rows = o.rows(), r = rows[i];
    if (t.dataset.sel != null) { if (t.checked) sel.add(i); else sel.delete(i); draw(); return; }
    const c = o.cols.find(x => x.k === t.dataset.c); if (!c) return;
    let v = c.ty === 'chk' ? t.checked : c.ty === 'num' ? (t.value === '' ? null : +t.value) : t.value;
    try { if (c.set) c.set(r, v); else r[c.k] = v; t.style.outline = ''; } catch (er) { t.style.outline = '2px solid var(--bad)'; status(er.message || String(er), true); return; }
    o.onChange && o.onChange(); dirty(); if (c.redraw || (o.key && c.k === o.key)) draw();
  });
  wrap.addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.s && t.tagName === 'TH') { const k = t.dataset.s; if (sortK === k) sortD = -sortD; else { sortK = k; sortD = 1; } draw(); return; }
    if (t.dataset.add != null) { o.rows().push(o.add()); o.onChange && o.onChange(); dirty(); filt = ''; sortK = null; draw(); const tw = wrap.querySelector('.tw'); tw.scrollTop = tw.scrollHeight; return; }
    if (t.dataset.del != null) { if (!confirm(fa(sel.size) + ' ردیف حذف شود؟')) return; const rows = o.rows(); [...sel].sort((a, b) => b - a).forEach(i => o.remove ? o.remove(i) : rows.splice(i, 1)); sel.clear(); o.onChange && o.onChange(); dirty(); draw(); return; }
    if (t.dataset.dupl != null) { const rows = o.rows(); for (const i of [...sel].sort((a, b) => a - b)) { const c = clone(rows[i]); if (o.key) c[o.key] = c[o.key] + '_copy'; o.dupl ? o.dupl(c) : rows.push(c); } sel.clear(); o.onChange && o.onChange(); dirty(); draw(); }
  });
  draw();
  return { draw };
}
// object of objects -> rows with an id field, written back on change
function asRows(obj, keyName) { return Object.entries(obj).map(([k, v]) => Object.assign({ [keyName]: k }, v)); }
const resCols = (k, l) => [['coin', 'سکه'], ['scroll', 'طومار'], ['ess', 'جوهره']].map(([r, n]) => ({ k: k + '_' + r, l: n, h: l, ty: 'num', get: x => (x[k] || {})[r] || 0, set: (x, v) => { x[k] = x[k] || {}; if (v) x[k][r] = v; else delete x[k][r]; } }));
const numOrNull = v => v == null || v === '' ? null : +v;

/* ---------- views ---------- */
const VIEWS = {};
const TYPES = [['prod', 'تولید'], ['magic', 'جادو'], ['skill', 'مهارت'], ['spell', 'طلسم'], ['crystal', 'چالش کریستال']];

VIEWS.art = m => {
  W.art = W.art || {}; W.art.mode = W.art.mode || {};
  m.innerHTML = `<h2>گرافیک</h2><p class="help">برای هر بخش تصویری بگذار (کلیک یا کشیدن فایل روی خانه). تصویر جای گرافیک ساده‌ای را می‌گیرد که برنامه الان می‌کشد. اگر تصویر کامل کارت را با متن و عددهایش داری، حالت «تصویر کامل» را انتخاب کن. اگر فقط نقاشی کارت را داری، حالت «فقط نقاشی» را بگذار تا متن و عددها را برنامه رویش بنویسد. فونت باید woff2، ttf یا otf باشد.</p>
  <div class="bar"><label>کارت‌های آکادمی: <select data-mode="cards"><option value="full">تصویر کامل</option><option value="illus">فقط نقاشی (متن را برنامه می‌نویسد)</option></select></label><label>جادوگران: <select data-mode="wizards"><option value="full">تصویر کامل</option></select></label><input type="search" id="art-q" placeholder="جستجو…"></div><div id="art-list"></div>`;
  m.querySelectorAll('[data-mode]').forEach(s => { s.value = W.art.mode[s.dataset.mode] || 'full'; s.onchange = () => { W.art.mode[s.dataset.mode] = s.value; dirty(); }; });
  const list = $('art-list');
  const draw = () => { const q = $('art-q').value.trim();
    list.innerHTML = slotsFor().map(([g, items]) => { const its = items.filter(it => !q || (it[2] + it[1]).includes(q)); if (!its.length) return ''; const done = its.filter(([c, k]) => (W.art[c] || {})[k]).length;
      return `<details ${q || g === 'پس‌زمینه‌ها و فونت‌ها' ? 'open' : ''} style="margin-bottom:10px"><summary><b>${g}</b> <span class="mut">${fa(done)} از ${fa(its.length)}</span></summary><div class="slots" style="margin-top:8px">${its.map(([c, k, n, ty, hint]) => { const p = (W.art[c] || {})[k], f = p && FILES[p];
        return `<div class="slot ${p ? 'has' : ''}" data-c="${c}" data-k="${esc(k)}" data-ty="${ty}">${p ? '<button class="x" data-x title="حذف">×</button>' : ''}<div class="pv">${f ? (ty === 'font' ? `<span>${esc(p.split('/').pop())}</span>` : `<img src="${f.url}">`) : `<span>${ty === 'font' ? 'فایل فونت' : 'بدون تصویر'}</span>`}</div><b>${esc(n)}</b>${hint ? `<span class="tag">${hint}</span>` : ''}</div>`; }).join('')}</div></details>`; }).join(''); };
  $('art-q').oninput = draw;
  let target = null;
  const take = async (slot, file) => {
    const c = slot.dataset.c, k = slot.dataset.k, ty = slot.dataset.ty;
    if (ty === 'image' && !/^image\//.test(file.type)) return status('این فایل تصویر نیست', true);
    if (ty === 'font' && !/\.(woff2?|ttf|otf)$/i.test(file.name)) return status('فایل فونت باید woff2، ttf یا otf باشد', true);
    const ext = (file.name.match(/\.[a-z0-9]+$/i) || ['.png'])[0].toLowerCase();
    const old = (W.art[c] || {})[k]; if (old) await delFile(old);
    const p = c + '/' + String(k).replace(/[^a-zA-Z0-9_-]/g, '_') + ext;
    await putFile(p, file); W.art[c] = W.art[c] || {}; W.art[c][k] = p; dirty('«' + file.name + '» گذاشته شد'); draw();
  };
  list.onclick = async e => { const s = e.target.closest('.slot'); if (!s) return;
    if (e.target.dataset.x != null) { const p = W.art[s.dataset.c][s.dataset.k]; delete W.art[s.dataset.c][s.dataset.k]; if (!artRefs().has(p)) await delFile(p); dirty(); draw(); return; }
    target = s; const f = $('f-up'); f.accept = s.dataset.ty === 'font' ? '.woff2,.woff,.ttf,.otf' : 'image/*'; f.click(); };
  $('f-up').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f && target) take(target, f); };
  list.ondragover = e => { const s = e.target.closest('.slot'); if (s) { e.preventDefault(); s.classList.add('drag'); } };
  list.ondragleave = e => { const s = e.target.closest('.slot'); if (s) s.classList.remove('drag'); };
  list.ondrop = e => { const s = e.target.closest('.slot'); if (!s) return; e.preventDefault(); s.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) take(s, f); };
  draw();
};

  // a quick full game with the robot
  try { const r = quickGame(); if (r) E.push('بازی آزمایشی ربات: ' + r); } catch (e) { E.push('بازی آزمایشی ربات خطا داد: ' + e.message); }

}
function quickGame() {

      let s = n, steps = 0; const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };

let GH = { owner: 'arttapart', repo: 'twelve-nights-digital', branch: 'main', token: '' };
async function ghApi(path, opt = {}) {
  const r = await fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + path, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json' }, opt.headers || {}) }));
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error('گیت‌هاب: ' + r.status + ' ' + m); }
  return r.status === 204 ? null : r.json();
}
const b64 = async blob => { const buf = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s); };

function gameJson() { const d = clone(W); delete d._cardRows; delete d._wizRows; return JSON.stringify(d, null, 1) + '\n'; }
async function publish(log) {
  const ref = await ghApi('/git/ref/heads/' + GH.branch); const head = ref.object.sha;
  const commit = await ghApi('/git/commits/' + head);
  const tree = await ghApi('/git/trees/' + commit.tree.sha + '?recursive=1');
  const remote = {}; for (const t of tree.tree) if (t.type === 'blob') remote[t.path] = t.sha;
  const want = { 'data/game.json': new Blob([gameJson()], { type: 'application/json' }) };
  for (const p of artRefs()) if (FILES[p]) want['data/art/' + p] = FILES[p].blob;
  const entries = [];
  for (const path in want) {
    const sha = await gitSha(want[path]);
    if (remote[path] === sha) continue;
    log('فرستادن ' + path + '…');
    const b = await ghApi('/git/blobs', { method: 'POST', body: JSON.stringify({ content: await b64(want[path]), encoding: 'base64' }) });
    entries.push({ path, mode: '100644', type: 'blob', sha: b.sha });
  }
  for (const path in remote) if (path.startsWith('data/art/') && !want[path]) entries.push({ path, mode: '100644', type: 'blob', sha: null });
  if (!entries.length) return null;
  const nt = await ghApi('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: commit.tree.sha, tree: entries }) });
  const nc = await ghApi('/git/commits', { method: 'POST', body: JSON.stringify({ message: 'ویرایشگر: نسخهٔ ' + W.meta.version, tree: nt.sha, parents: [head] }) });
  await ghApi('/git/refs/heads/' + GH.branch, { method: 'PATCH', body: JSON.stringify({ sha: nc.sha }) });
  return nc.sha;
}
async function loadFromGitHub(log) {
  const meta = await ghApi('/contents/data/game.json?ref=' + GH.branch);
  const txt = new TextDecoder().decode(Uint8Array.from(atob(meta.content.replace(/\n/g, '')), c => c.charCodeAt(0)));
  const d = JSON.parse(txt);
  const ref = await ghApi('/git/ref/heads/' + GH.branch); const commit = await ghApi('/git/commits/' + ref.object.sha);
  const tree = await ghApi('/git/trees/' + commit.tree.sha + '?recursive=1');
  for (const t of tree.tree) if (t.type === 'blob' && t.path.startsWith('data/art/')) {
    const p = t.path.slice(9); if (FILES[p] && await gitSha(FILES[p].blob) === t.sha) continue;
    log('گرفتن ' + p + '…'); const b = await ghApi('/git/blobs/' + t.sha);
    const bin = Uint8Array.from(atob(b.content.replace(/\n/g, '')), c => c.charCodeAt(0));

const mimeOf = p => ({ png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', svg: 'image/svg+xml', gif: 'image/gif', woff2: 'font/woff2', woff: 'font/woff', ttf: 'font/ttf', otf: 'font/otf' }[p.split('.').pop().toLowerCase()] || 'application/octet-stream');
